[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "A quantitative research and portfolio management system."
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]